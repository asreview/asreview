name: Test ASReview core
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: |
          pip install .[dev]
      - name: Lint Python
        run: |
          ruff check --extend-exclude=asreview/webapp
  test-asreview-core:
    name: test-asreview-core
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install packages
        run: |
          pip install pytest
          pip install --no-cache-dir .[test]
          pip install --no-cache-dir .
      - name: Cache synergy dataset
        uses: actions/cache@v4
        with:
          path: ~/.synergy_dataset_source
          key: synergy-plus-dataset-${{ runner.os }}-v3.0
      - name: Download synergy dataset
        run: |
          python -c "
          from synergy_dataset.base import _dataset_available, download_raw_dataset
          try:
              download_raw_dataset(source='dataverse')
          except Exception:
              download_raw_dataset(source='github')
          print('Synergy dataset available:', _dataset_available())
          "
      - name: Cache OSF test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/asreview_tests
          key: osf-test-data-v1
      - name: Download OSF test data
        run: |
          python -c "
          from pathlib import Path
          cache_dir = Path('~/.cache/asreview_tests').expanduser()
          cache_dir.mkdir(parents=True, exist_ok=True)
          # Mirror tests/conftest.py: a warm cache must not touch the network.
          # Resolving the filename from the URL is itself an HTTP request, so
          # doing it up front makes a restored cache useless when OSF is down.
          cached_files = list(cache_dir.iterdir())
          if cached_files:
              print('OSF fg93a already cached as', cached_files[0].name)
          else:
              import urllib.request
              from asreview.utils import _get_filename_from_url
              url = 'https://osf.io/download/fg93a/'
              try:
                  cache_file = cache_dir / _get_filename_from_url(url)
                  urllib.request.urlretrieve(url, cache_file)
                  print('Downloaded OSF fg93a as', cache_file.name)
              except OSError as err:
                  # Do not fail the job on an OSF outage. The osf_fg93a_path
                  # fixture skips the tests that need this dataset.
                  print('WARNING: could not download OSF fg93a:', err)
          "
      - name: Build project
        run: |
          python -m pip install build
          python -m build
      - name: Run test suite with pytest
        run: |
          pytest tests/
